name: Build Reel Monster APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Find Project and Build APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle" -not -path "*/.*" | head -n 1))
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            if [ -f "ReelMonster-Android-Project.zip" ]; then
              unzip -o ReelMonster-Android-Project.zip
              PROJECT_DIR="ReelMonster-Android"
            else
              echo "Error: settings.gradle not found!"
              exit 1
            fi
          fi
          echo "Building from directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelMonster-debug-apk
          path: "**/app-debug.apk"
