name: Build Reel Monster APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Locate Project and Build APK
        run: |
          if [ -f "ReelMonster-Android-Project.zip" ]; then
            unzip -o ReelMonster-Android-Project.zip
          fi
          if [ -f "ReelMonster-Android/settings.gradle" ]; then
            cd ReelMonster-Android
          fi
          gradle assembleDebug --no-daemon

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelMonster-debug-apk
          path: "**/app-debug.apk"
